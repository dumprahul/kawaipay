services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: kawaipay
      POSTGRES_PASSWORD: kawaipay
      POSTGRES_DB: kawaipay
    ports:
      - "5432:5432"
    volumes:
      - kawaipay_postgres_data:/var/lib/postgresql/data
      - ../db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kawaipay"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  kawaipay_postgres_data:
