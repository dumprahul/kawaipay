name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  node:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kawaipay
          POSTGRES_PASSWORD: kawaipay
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kawaipay"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6390:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      POSTGRES_ADMIN_URL: postgres://kawaipay:kawaipay@localhost:5432/postgres
      GATEWAY_TEST_REDIS_URL: redis://127.0.0.1:6390
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Enable corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit tests (packages/*)
        run: pnpm run test

      - name: Database migration + constraint tests
        run: pnpm run test:db

  contracts:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Sui CLI
        run: brew install sui

      - name: Move build
        working-directory: contracts
        run: sui move build

      - name: Move tests
        working-directory: contracts
        run: sui move test
